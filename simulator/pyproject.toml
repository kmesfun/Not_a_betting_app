[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "live-season-simulator"
version = "0.1.0"
description = "Live Season Simulator (Phase 1 MVP) -- NBA Monte Carlo championship simulator, mock data"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.vercel]
# Disambiguates Vercel's FastAPI auto-detection: with the Vercel project's
# Root Directory set to this `simulator/` folder, it found two module-level
# `app` variables under here -- src/simulator/api.py (the real app) and
# tests/test_api.py (a fastapi.testclient.TestClient also named `app`) --
# and refused to guess. Pin it to the real one explicitly.
entrypoint = "src.simulator.api:app"
